name: security
# Repo-wide gates. No paths filter: a gate that fires only on some paths is green about the rest.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan history, not just the working tree
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gl.tgz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --redact --verbose --exit-code 1
  leak-gate:
    name: leak-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/leak_gate/check_tracked.py
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python audit (if pyproject.toml exists)
        run: |
          if [ -f pyproject.toml ]; then uv sync && uv run pip-audit --strict --vulnerability-service osv; else echo "no pyproject.toml — skipped (reported, not passed)"; fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: npm audit (if package.json exists)
        run: |
          if [ -f package.json ]; then pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high; else echo "no package.json — skipped (reported, not passed)"; fi
