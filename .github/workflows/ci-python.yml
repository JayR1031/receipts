name: ci-python
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci-python:
    name: ci-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: find src tests -name __pycache__ -type d -exec rm -rf {} +; uv run pytest -q -m "not integration"
