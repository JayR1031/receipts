name: ci-python
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci-python:
    name: ci-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: find src tests -name __pycache__ -type d -exec rm -rf {} +; uv run pytest -q -m "not integration"
