name: Task
description: Work to be planned and done
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this task produce, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done? List the checks that must pass.
    validations:
      required: true
