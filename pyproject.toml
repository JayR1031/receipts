[project]
name = "receipts"
version = "0.1.0"
description = "Competitive-intel agent crew where every claim carries a verified receipt"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.6", "pyright>=1.1.380", "pip-audit>=2.7", "httpx>=0.27"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a database or network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "ANN"]
mccabe.max-complexity = 6

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"
